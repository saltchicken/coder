[package]
name = "coder"
version = "0.1.0"
edition = "2021"
description = "Autonomous AI Coding Agent (Rust Port)"
authors = ["AI Coder"]

[dependencies]
# Async runtime and HTTP client
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }

# Serialization and JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Text manipulation and Regex
regex = "1.10"
similar = "2.4" # For generating unified diffs
colored = "2.1" # For terminal colors

# Logging and error handling
log = "0.4"
simplelog = "0.12"
anyhow = "1.0"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
dirs = "5.0" # Added to safely resolve the user's home directory across platforms
